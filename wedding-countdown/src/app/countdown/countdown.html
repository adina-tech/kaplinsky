<span class="label">עד החופה</span>

<div class="tiles" role="timer">
  @for (unit of units(); track unit.label) {
    <div class="tile">
      <!-- keyed on the value so the tick animation replays on every change -->
      @for (v of [unit.value]; track v) {
        <span class="num">{{ v }}</span>
      }
      <span class="unit">{{ unit.label }}</span>
    </div>
  }
</div>
